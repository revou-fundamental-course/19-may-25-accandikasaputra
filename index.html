<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Website</title>
  <link rel="stylesheet"  href="css/style.css"/>

</head>
<body>
  <header>
    <div class="logo">
        <!-- 🟡 -->
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="profile.html">Our Profile</a>
      <a href="#skills">Our Skills</a>
      <a href="#message">Message Us</a>
    </nav>
  </header>
  
  <main>
    <section class="hero">
      <h1 id="welcome-text">Hi <span id="user-name"></span>, Welcome To Website</h1>
      <p>ini adalah website mini course revou</p>
      <div class="image-placeholder">
        <img src="img/banner 1.png" alt="image-placeholder">
      </div>
    </section>

    <section class="facilities" id="skills">
      <h2>Our Skills</h2>
      <div class="facility-items">
        <div class="item">
          <div class="circle">
            <img src="img/pm.png" alt="project management">
          </div>
          <p>Project Management</p>
        </div>
        <div class="item">
          <div class="circle">
            <img src="img/be.png" alt="project management">
          </div>
          <p>Backend Development</p>
        </div>
        <div class="item">
          <div class="circle">
            <img src="img/da.png" alt="project management">
          </div>
          <p>Data Analyst</p>
        </div>
      </div>
    </section>

    <section class="contact" id="message">
      <h2>Message Us</h2>
      <form id="message-form">
        <label>Name:</label>
        <input type="text" id="name" required />
        <label>Date of Birth:</label>
        <input type="date" id="dob" required />
        <label>Gender:</label>
        <select id="gender">
          <option value="">--Select--</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
        </select>
        <label>Message:</label>
        <textarea id="message-content" required></textarea>
        <button type="submit">Submit</button>
      </form>

      <div class="submitted" id="submitted-info">
        <p><strong>Browser Info:</strong> <span id="browser-info"></span></p>
        <p><strong>Time:</strong> <span id="timestamp"></span></p>
        <p><strong>Feedback:</strong> <span id="user-message"></span></p>
      </div>
    </section>
  </main>

  <footer>
    <p>Created by: Andika Saputra</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
